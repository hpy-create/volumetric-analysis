            }

            if (type === "sulphite-titration-diagram") {
                return `
                <div class="my-4 p-4 bg-emerald-50/60 rounded-2xl border border-emerald-200 flex flex-col items-center shadow-sm fade-in">

                        <span class="text-[11px] font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full border border-emerald-200">

                    </div>
                    <svg viewBox="0 0 460 285" class="w-full max-w-lg h-auto bg-white rounded-xl border border-emerald-100 p-2">
                        <!-- White Tile -->
                        <rect x="125" y="250" width="130" height="8" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
                        <text x="285" y="257" font-family="Inter, sans-serif" font-size="11" fill="#475569">White tile</text>
                        <line x1="255" y1="254" x2="280" y2="254" stroke="#64748b" stroke-width="1"/>

                        <!-- Burette Tube -->

                        <!-- Stopcock & Tip -->

                        <line x1="193" y1="128" x2="193" y2="148" stroke="#334155" stroke-width="2"/>
                        <rect x="177" y="134" width="26" height="6" rx="2" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
                        <!-- Falling purple drop -->
                        <circle cx="190" cy="155" r="2.8" fill="#7e22ce"/>

                        <!-- Stand & Clamp (Left side) -->
                        <rect x="75" y="250" width="45" height="6" fill="#64748b"/>
                        <rect x="94" y="14" width="5" height="236" fill="#64748b"/>
                        <rect x="99" y="82" width="84" height="5" fill="#475569"/>
                        <rect x="179" y="79" width="22" height="11" rx="2" fill="none" stroke="#334155" stroke-width="1.5"/>

                        <!-- Labels & Pointer Lines -->
                        <!-- Top Meniscus Tip -->
                        <line x1="197" y1="36" x2="235" y2="28" stroke="#7e22ce" stroke-width="1.2" stroke-dasharray="3 2"/>

                        <text x="240" y="38" font-family="Inter, sans-serif" font-size="9.5" fill="#7e22ce">(dark purple solution)</text>

                        <!-- Burette Label -->
                        <line x1="197" y1="54" x2="235" y2="54" stroke="#334155" stroke-width="1.2"/>

                        <!-- Standard Acidified KMnO4 in Burette -->
                        <line x1="197" y1="84" x2="235" y2="84" stroke="#334155" stroke-width="1.2"/>

                        <text x="240" y="94" font-family="Inter, sans-serif" font-size="10" fill="#475569">(0.0100 mol dm⁻³, purple)</text>

                        <!-- Conical Flask -->
                        <line x1="218" y1="190" x2="245" y2="178" stroke="#334155" stroke-width="1.2"/>

                        <!-- Sodium Sulphite Solution -->
                        <line x1="228" y1="224" x2="255" y2="212" stroke="#059669" stroke-width="1.5"/>
                        <text x="260" y="211" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#065f46">25.0 cm³ sodium sulphite</text>
                        <text x="260" y="224" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#047857">solution, Na₂SO₃(aq)</text>
                        <text x="260" y="236" font-family="Inter, sans-serif" font-size="9.5" fill="#475569">(colourless)</text>
                    </svg>
                </div>`;
            }

            return "";
        }

        // ==========================================
        // RENDERING LOGIC
        // ==========================================
        function renderSidebar() {
            const nav = document.getElementById("question-nav");
            nav.innerHTML = questionsData.map((q, idx) => {
                const isActive = idx === currentQuestionIndex;
                const completedInQ = q.parts.filter(p => state.completedParts[p.id]).length;
                const allDone = completedInQ === q.parts.length;

                return `
                <button onclick="selectQuestion(${idx})"
                    class="w-full text-left px-3 py-2.5 rounded-xl flex items-center justify-between transition-all ${
                        isActive 
                        ? 'bg-indigo-50 text-indigo-700 border border-indigo-200 font-semibold shadow-sm' 
                        : 'text-slate-600 hover:bg-slate-100 border border-transparent'
                    }">
                    <div class="flex items-center space-x-2.5 min-w-0">
                        <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs flex-shrink-0 ${
                            allDone 
                            ? 'bg-emerald-100 text-emerald-700' 
                            : isActive ? 'bg-indigo-600 text-white' : 'bg-slate-200/70 text-slate-600'
                        }">
                            ${allDone ? '<i class="fa-solid fa-check"></i>' : `<i class="fa-solid ${q.icon}"></i>`}
                        </span>
                        <div class="truncate">
                            <div class="text-sm truncate">${q.shortTitle}</div>
                            <div class="text-[11px] text-slate-400 font-normal">${completedInQ}/${q.parts.length} parts &bull; ${q.marks} marks</div>
                        </div>
                    </div>
                </button>`;
            }).join("");

            // Update global progress header
            const totalDone = Object.values(state.completedParts).filter(Boolean).length;
            document.getElementById("progress-text").textContent = `${totalDone} / ${totalSubparts}`;
        }

        function renderWorkspace() {
            const q = questionsData[currentQuestionIndex];
            const workspace = document.getElementById("workspace");

            // Header Card for the Question
            let html = `
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden fade-in">
                <div class="bg-gradient-to-r from-slate-900 to-slate-800 px-6 py-5 text-white flex flex-wrap items-center justify-between gap-4">
                    <div>
                        <div class="flex items-center space-x-2 text-indigo-300 text-xs font-semibold uppercase tracking-wider mb-1">
                            <span>Question ${q.id} of ${questionsData.length}</span>
                            <span>&bull;</span>
                            <span>${q.topic}</span>
                        </div>
                        <h2 class="text-xl sm:text-2xl font-bold">${q.shortTitle}</h2>
                    </div>
                    <div class="bg-white/10 backdrop-blur-sm border border-white/20 px-4 py-2 rounded-xl text-right">
                        <div class="text-xs text-slate-300">Section Total</div>
                        <div class="text-lg font-extrabold text-white">${q.marks} Marks</div>
                    </div>
                </div>

                <div class="p-6">
                    <div class="text-slate-700 text-sm sm:text-base leading-relaxed">
                        ${q.prompt}
                    </div>
                    ${q.visualPrompt ? getVisualHTML(q.visualPrompt) : ""}
                </div>
            </div>
            `;

            // Render Each Sub-part Card
            q.parts.forEach((part) => {
                const stepsShown = state.revealedSteps[part.id] || 0;
                const totalSteps = part.steps.length;
                const allStepsShown = stepsShown >= totalSteps;
                const hintShown = !!state.revealedHints[part.id];
                const isCompleted = !!state.completedParts[part.id];
                const selectedQuizOpt = state.quizAnswers[part.id];

                html += `
                <div id="part-${part.id}" class="bg-white rounded-2xl border ${isCompleted ? 'border-emerald-300 ring-1 ring-emerald-100' : 'border-slate-200'} shadow-sm p-6 transition-all fade-in">
                    <!-- Sub-question Header -->
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <div class="flex items-start space-x-3">
                            <span class="px-2.5 py-1 rounded-lg bg-indigo-100 text-indigo-800 font-bold text-sm flex-shrink-0 mt-0.5">
                                ${part.label}
                            </span>
                            <h3 class="text-base sm:text-lg font-semibold text-slate-900 leading-snug">
                                ${part.question}
                            </h3>
                        </div>
                        <span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 font-semibold text-xs whitespace-nowrap flex-shrink-0">
                            (${part.marks} ${part.marks === 1 ? 'mark' : 'marks'})
                        </span>
                    </div>

                    <!-- Action Toolbar: Hint & Step Reveal -->
                    <div class="flex flex-wrap items-center gap-2.5 mb-4">
                        <button onclick="toggleHint('${part.id}')" class="px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition-all ${
                            hintShown 
                            ? 'bg-amber-100 text-amber-900 border border-amber-300' 
                            : 'bg-slate-100 hover:bg-amber-50 text-slate-700 hover:text-amber-800 border border-slate-200'
                        }">
                            <i class="fa-regular fa-lightbulb"></i>
                            <span>${hintShown ? 'Hide Hint' : 'Need a Hint?'}</span>
                        </button>

                        ${!allStepsShown ? `
                        <button onclick="revealNextStep('${part.id}')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white flex items-center space-x-1.5 shadow-sm transition-all">
                            <i class="fa-solid fa-shoe-prints"></i>
                            <span>${stepsShown === 0 ? 'Show Step 1' : `Next Step (${stepsShown}/${totalSteps})`}</span>
                        </button>
                        ` : ''}

                        ${!allStepsShown && totalSteps > 1 ? `
                        <button onclick="revealAllSteps('${part.id}')" class="px-3.5 py-2 rounded-xl text-xs font-medium text-indigo-600 hover:bg-indigo-50 border border-indigo-200 transition-all">
                            Reveal Full Solution
                        </button>
                        ` : ''}

                        ${allStepsShown ? `
                        <button onclick="resetPart('${part.id}')" class="px-3 py-2 rounded-xl text-xs font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition-all">
                            <i class="fa-solid fa-rotate-left mr-1"></i> Collapse Steps
                        </button>
                        ` : ''}
                    </div>

                    <!-- Hint Drawer -->
                    ${hintShown ? `
                    <div class="mb-4 p-4 rounded-xl bg-amber-50/90 border border-amber-200 text-amber-900 text-sm fade-in">
                        <div class="font-semibold text-xs uppercase tracking-wider text-amber-700 mb-1">
                            <i class="fa-solid fa-compass mr-1"></i> Tutor Hint
                        </div>
                        <p>${part.hint}</p>
                    </div>
                    ` : ''}

                    <!-- Optional Extra Concept Card (Always visible when defined, e.g. Question 1c) -->
                    ${part.extraNote ? part.extraNote : ''}

                    <!-- Step-by-Step Breakdown Container -->
                    ${stepsShown > 0 ? `
                    <div class="space-y-3 mt-4 border-t border-slate-100 pt-4">
                        <!-- Key Concept Banner -->
                        <div class="p-3.5 rounded-xl bg-sky-50 border border-sky-200/80 text-sky-900 text-xs sm:text-sm">
                            <span class="font-bold text-sky-800"><i class="fa-solid fa-book-open mr-1.5"></i>Key Principle:</span> ${part.concept}
                        </div>

                        ${part.visualType ? getVisualHTML(part.visualType) : ""}

                        <!-- Individual Steps -->
                        <div class="space-y-2.5">
                            ${part.steps.slice(0, stepsShown).map((step, sIdx) => `
                            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200/90 fade-in">
                                <div class="text-xs font-bold text-indigo-600 uppercase tracking-wider mb-1">
                                    ${step.title}
                                </div>
                                <div class="text-sm text-slate-800 leading-relaxed">
                                    ${step.content}
                                </div>
                            </div>
                            `).join("")}
                        </div>

                        <!-- Final Official Marking Scheme Answer (Shown when all steps revealed) -->
                        ${allStepsShown ? `
                        <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200 fade-in">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-xs font-bold uppercase tracking-wider text-emerald-700">
                                    <i class="fa-solid fa-check-double mr-1"></i> Final Marking Scheme Answer
                                </span>
                                <span class="text-xs font-semibold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-md">
                                    +${part.marks} ${part.marks === 1 ? 'Mark' : 'Marks'}
                                </span>
                            </div>
                            <div class="text-sm sm:text-base font-semibold text-emerald-950 mt-1">
                                ${part.finalAnswer}
                            </div>
                        </div>

                        <!-- Interactive Concept Check Quiz -->
                        ${part.quiz ? `
                        <div class="mt-4 p-4 rounded-xl bg-indigo-50/60 border border-indigo-100 fade-in">
                            <div class="text-xs font-bold uppercase tracking-wider text-indigo-700 mb-2">
                                <i class="fa-solid fa-brain mr-1"></i> Quick Concept Check
                            </div>
                            <p class="text-sm font-medium text-slate-800 mb-3">${part.quiz.question}</p>
                            <div class="space-y-2">
                                ${part.quiz.options.map((opt, oIdx) => {
                                    const isSelected = selectedQuizOpt === oIdx;
                                    const isCorrect = part.quiz.correct === oIdx;
                                    let btnStyle = "bg-white border-slate-200 hover:border-indigo-300 text-slate-700";
                                    if (selectedQuizOpt !== undefined) {
                                        if (isCorrect) {
                                            btnStyle = "bg-emerald-100 border-emerald-400 text-emerald-900 font-medium";
                                        } else if (isSelected && !isCorrect) {
                                            btnStyle = "bg-rose-100 border-rose-400 text-rose-900";
                                        } else {
                                            btnStyle = "bg-white/60 border-slate-200 text-slate-400";
                                        }
                                    }
                                    return `
                                    <button onclick="answerQuiz('${part.id}', ${oIdx})" class="w-full text-left px-3.5 py-2.5 rounded-xl border text-xs sm:text-sm transition-all flex items-center justify-between ${btnStyle}">
                                        <span>${opt}</span>
                                        ${selectedQuizOpt !== undefined && isCorrect ? '<i class="fa-solid fa-circle-check text-emerald-600 ml-2"></i>' : ''}
                                        ${selectedQuizOpt !== undefined && isSelected && !isCorrect ? '<i class="fa-solid fa-circle-xmark text-rose-600 ml-2"></i>' : ''}
                                    </button>`;
                                }).join("")}
                            </div>
                            ${selectedQuizOpt !== undefined ? `
                            <div class="mt-2.5 text-xs ${selectedQuizOpt === part.quiz.correct ? 'text-emerald-800' : 'text-rose-800'} font-medium">
                                ${part.quiz.explanation}
                            </div>
                            ` : ''}
                        </div>
                        ` : ''}
                        ` : ''}
                    </div>
                    ` : ''}
                </div>
                `;
            });

            workspace.innerHTML = html;

            // Update bottom navigation buttons
            document.getElementById("prev-btn").disabled = currentQuestionIndex === 0;
            document.getElementById("next-btn").disabled = currentQuestionIndex === questionsData.length - 1;
        }

        // ==========================================
        // INTERACTION HANDLERS
        // ==========================================
        function selectQuestion(index) {
            currentQuestionIndex = index;
            renderSidebar();
            renderWorkspace();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigateQuestion(delta) {
            const newIdx = currentQuestionIndex + delta;
            if (newIdx >= 0 && newIdx < questionsData.length) {
                selectQuestion(newIdx);
            }
        }

        function toggleHint(partId) {
            state.revealedHints[partId] = !state.revealedHints[partId];
            renderWorkspace();
        }

        function findPart(partId) {
            for (const q of questionsData) {
                const found = q.parts.find(p => p.id === partId);
                if (found) return found;
            }
            return null;
        }

        function revealNextStep(partId) {
            const part = findPart(partId);
            if (!part) return;
            const current = state.revealedSteps[partId] || 0;
            if (current < part.steps.length) {
                state.revealedSteps[partId] = current + 1;
                if (state.revealedSteps[partId] === part.steps.length) {
                    state.completedParts[partId] = true;
                    showToast(`Part ${part.label} completed! (+${part.marks} marks reviewed)`);
                }
                renderSidebar();
                renderWorkspace();
            }
        }

        function revealAllSteps(partId) {
            const part = findPart(partId);
            if (!part) return;
            state.revealedSteps[partId] = part.steps.length;
            state.completedParts[partId] = true;
            showToast(`Full solution unlocked for Part ${part.label}`);
            renderSidebar();
            renderWorkspace();
        }

        function resetPart(partId) {
            state.revealedSteps[partId] = 0;
            state.completedParts[partId] = false;
            delete state.quizAnswers[partId];
            renderSidebar();
            renderWorkspace();
        }

        function answerQuiz(partId, optionIndex) {
            state.quizAnswers[partId] = optionIndex;
            const part = findPart(partId);
            if (part && optionIndex === part.quiz.correct) {
                showToast("Spot on! Concept mastered.", "success");
            }
            renderWorkspace();
        }

        function resetAllProgress() {
            state = {
                revealedHints: {},
                revealedSteps: {},
                completedParts: {},
                quizAnswers: {}
            };
            renderSidebar();
            renderWorkspace();
            showToast("All progress reset.", "info");
        }

        // Custom Toast Notification (No alert() used!)
        function showToast(message, type = "success") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            const bgClass = type === "success" ? "bg-slate-900 text-white border-slate-700" : "bg-indigo-600 text-white border-indigo-500";
            toast.className = `${bgClass} border px-4 py-2.5 rounded-xl shadow-lg text-xs font-medium flex items-center space-x-2 fade-in`;
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transition = "opacity 0.3s ease";
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // ==========================================
        // INITIALIZE APP ON LOAD
        // ==========================================
        window.onload = function() {
            renderSidebar();
            renderWorkspace();
        };
